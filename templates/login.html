<!DOCTYPE html>
<html>

<head>
    <title>Вход в систему</title>
    <style>
        body {
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
        }

        form {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        input {
            display: block;
            width: 250px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <form method="POST">
        <h2 style="text-align: center;">Вход в систему</h2>
        {% if error %}<p style="color: #e74c3c; margin: 0 0 15px 0; font-size: 0.9em;">{{ error }}</p>{% endif %}
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
        <p style="font-size: 0.8em; color: #666; text-align: center;">admin / admin</p>
    </form>
</body>

</html>
